# What scripts/paperclip-setup.mjs provisions in Paperclip. Copy to config/paperclip.yaml.
# Re-running the setup applies changes idempotently (matched by name/title).

company:
  name: Pennyworth
  description: Personal operations control plane

labels:
  - { name: meeting-action, color: "#2563eb" }
  - { name: needs-review, color: "#d97706" }
  - { name: waiting-on, color: "#7c3aed" }
  - { name: system-error, color: "#dc2626" }
  - { name: daily-brief, color: "#059669" }
  - { name: todo, color: "#0891b2" }
  - { name: needs-response, color: "#e11d48" }
  - { name: engineer, color: "#4f46e5" }
  - { name: email, color: "#ea580c" }

# MCP servers given to Codex agents directly through the shared Codex config
# (/paperclip/.codex/config.toml). Not registered as Paperclip Tool Connections: the
# Paperclip gateway drops MCP tool annotations, so Codex would refuse every write tool.
# See docs/DECISIONS.md (D-8). Tokens come from env vars set from secret files.
mcp_servers:
  ops_mcp:
    url: http://ops-mcp:8080/mcp
    bearer_token_env_var: PENNYWORTH_OPS_MCP_TOKEN
  google_workspace:
    url: http://google-workspace-mcp:8081/mcp
    bearer_token_env_var: PENNYWORTH_GOOGLE_MCP_TOKEN
  slack:
    url: http://slack-mcp:8082/mcp
    bearer_token_env_var: PENNYWORTH_SLACK_MCP_TOKEN
  paperclip_tasks:
    command: node
    args: [/opt/pennyworth/paperclip-tasks-mcp.mjs]
    env_vars: [PAPERCLIP_API_KEY, PAPERCLIP_API_URL, PAPERCLIP_RUN_ID, PAPERCLIP_COMPANY_ID, PAPERCLIP_TASK_ID]

# Extra Codex CLI arguments for every agent. Codex's read-only sandbox stays on (inside
# the container it fails closed, so shell commands cannot run at all), and built-in
# tools that could reach external accounts or the network are disabled.
codex_args:
  - --sandbox
  - read-only
  # Paperclip run workspaces are not git repositories.
  - --skip-git-repo-check
  - -c
  - features.shell_tool=false
  - -c
  - features.unified_exec=false
  - -c
  - features.apps=false
  - -c
  - features.browser_use=false
  - -c
  - features.browser_use_external=false
  - -c
  - features.in_app_browser=false
  - -c
  - features.computer_use=false
  - -c
  - features.image_generation=false
  - -c
  - web_search="disabled"

agents:
  meeting-librarian:
    name: Meeting Librarian
    title: Meeting memory
    instructions: config/agents/meeting-librarian.md
    adapter: codex_local
    model: ""                  # empty = Paperclip's Codex default
    reasoning_effort: medium
    timeout_sec: 1800
    # Only these MCP servers (and tools) are visible to this agent.
    mcp_servers: [ops_mcp, google_workspace, paperclip_tasks]
    enabled_tools:
      paperclip_tasks: [task_current, task_get, task_comment, task_set_status]

  chief-of-staff:
    name: Chief of Staff
    title: Daily attention brief
    instructions: config/agents/chief-of-staff.md
    adapter: codex_local
    model: ""
    reasoning_effort: medium
    timeout_sec: 1200
    mcp_servers: [google_workspace, paperclip_tasks]
    enabled_tools:
      google_workspace: [calendar_list_events, calendar_get_event]

  slack-scout:
    name: Slack Scout
    title: Slack attention
    instructions: config/agents/slack-scout.md
    adapter: codex_local
    model: ""
    reasoning_effort: medium
    timeout_sec: 1200
    mcp_servers: [slack, paperclip_tasks]
    enabled_tools:
      paperclip_tasks: [task_current, task_get, task_search, task_list, task_create, task_update, task_comment, task_set_status]

  inbox-agent:
    name: Inbox Agent
    title: Emails you label pennyworth → tasks
    instructions: config/agents/inbox-agent.md
    adapter: codex_local
    model: ""
    reasoning_effort: medium
    timeout_sec: 1200
    mcp_servers: [google_workspace, paperclip_tasks]
    enabled_tools:
      google_workspace: [gmail_search, gmail_read_thread]
      paperclip_tasks: [task_current, task_get, task_search, task_list, task_create, task_update, task_comment, task_set_status]

  assistant:
    name: Assistant
    title: Research, drafts and acting on your task replies
    instructions: config/agents/assistant.md
    adapter: codex_local
    model: ""
    reasoning_effort: medium
    timeout_sec: 1800
    mcp_servers: [slack, google_workspace, paperclip_tasks, ops_mcp]
    enabled_tools:
      ops_mcp: [obsidian_search, obsidian_read, obsidian_read_document_map, meeting_note_correct]
      google_workspace: [docs_read, drive_search_files, drive_read_file, drive_list_recent_files, calendar_list_events, calendar_search_events, calendar_get_event, gmail_search, gmail_read_thread]

  engineer:
    name: Engineer
    title: Coding jobs on this machine (pennyworth-runner)
    instructions: config/agents/engineer.md
    adapter: codex_local
    # Assignment target only: Paperclip never wakes it; the host runner does the work.
    dispatch: runner
    mcp_servers: []

routines:
  meeting-scan:
    title: Meeting scan
    agent: meeting-librarian
    description: |
      Meeting artifacts may have changed. Follow your instructions: scan with ops-mcp,
      match new sources against the calendar, publish matched meetings, check Drive
      meeting documents if the Drive tool is available, then close this task with a
      short count summary.
    concurrency: coalesce_if_active
    webhook: true                       # fired by the transcript watcher
    schedules:
      # Backstop for missed file events, review decisions and Drive documents.
      - { cron: "*/15 8-20 * * 1-5", timezone: Europe/Madrid, label: "work hours" }

  daily-brief:
    title: Prepare daily brief
    agent: chief-of-staff
    description: |
      Today is {{date}}. Prepare today's daily brief following your instructions: gather open tasks and
      today's calendar, create or update today's "Daily Brief" task, close yesterday's,
      then close this task with a one-line summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "30 8 * * 1-5", timezone: Europe/Madrid, label: "weekday morning" }

  slack-scan:
    title: Slack scan
    agent: slack-scout
    description: |
      Today is {{date}}. Your Slack user ID is U00000000. Follow your instructions: find
      Slack messages that need the user, create or update tasks (deduplicated), close
      tasks the user has already answered, then close this task with a count summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "*/30 8-20 * * 1-5", timezone: Europe/Madrid, label: "work hours" }

  task-replies:
    title: Process task replies
    agent: assistant
    # Started by pennyworth-runner when you comment on your tasks (no schedule).
    description: |
      Process replies on: {{tasks}}
      Follow "B. Processing the user's replies" in your instructions.
    concurrency: always_enqueue

  inbox-scan:
    title: Inbox scan
    agent: inbox-agent
    description: |
      Today is {{date}}. Your user's email address is you@example.com. Follow your instructions:
      one task per thread labelled pennyworth in Gmail (deduplicated), close tasks whose
      label was removed, then close this task with a count summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "*/30 8-19 * * 1-5", timezone: Europe/Madrid, label: "work hours" }
