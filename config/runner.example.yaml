# Pennyworth runner (host service): coding jobs for Paperclip tasks labelled "engineer".
# Copy to config/runner.yaml. Runs as you; see docs/DECISIONS.md D-14 for the guardrails.

label: engineer
poll_seconds: 20
# Comments written up to this long before the runner first sees a task still count.
first_seen_lookback_minutes: 30

# Only repositories in these GitHub orgs can be worked on.
allowed_orgs: [your-org]

# Runner-owned clones (repos/) and per-task worktrees (tasks/). Never your own checkouts.
work_dir: ~/pennyworth
state_dir: ~/.local/state/pennyworth-runner

max_concurrent: 2
timeout_minutes: 60

engines:
  codex:
    model: ""                         # empty = your Codex default
  openrouter:                         # Engineer · OpenRouter; models it offers are listed in config/paperclip.yaml
    model: z-ai/glm-5.3-flash
    key_file: ~/.config/pennyworth/openrouter_key
  claude:                             # "engine: claude" / "use Claude": Claude Code, headless, inside codex sandbox
    model: ""                         # empty = Claude Code's default; or opus, sonnet, haiku, fable, claude-…
    token_file: ~/.config/pennyworth/claude_oauth_token   # from `claude setup-token` (0600)
    # Runner-owned Claude Code home: none of your plugins, hooks, MCP servers or claude.ai connectors.
    config_dir: ~/.local/state/pennyworth-runner/claude

# Reads plain-language requests (target repo, reference repos, mode, model) with a short Codex call.
intake:
  model: ""                           # empty = your Codex default
  reasoning_effort: low
  timeout_seconds: 180

devshells:
  flake: ~/config/nixos               # nix develop <flake>#<shell>
  engine_shell: llm                   # provides codex/opencode; always outermost
  available: [go, go-cgo, kurtosis, llm, mobile, node, postgres, pulumi, python, python311, rust]
  # Detected from files in the repository root (override per task with "shells: go,pulumi").
  detect:
    go.mod: go
    package.json: node
    pnpm-lock.yaml: node
    Cargo.toml: rust
    pyproject.toml: python
    requirements.txt: python
    Pulumi.yaml: pulumi
  # Added when the instructions match (regex → shell): gcloud lives in the pulumi shell.
  keyword_shells:
    "gcloud|cloud logging|stackdriver|gke|bigquery|log explorer": pulumi

sandbox:
  network: true                       # gh, gcloud, Grafana and package registries need it
  # Writable besides the task worktree (build caches); everything else is read-only to the agent.
  extra_writable_roots:
    - ~/.cache
    - ~/go/pkg/mod
    - ~/.npm
    - ~/.local/share/pnpm
    - ~/.cargo/registry
    - ~/.cargo/git
    - ~/.gradle

# Review-request tasks close themselves once GitHub shows you reviewed the PR (after the ask), or the
# PR was merged or closed (D-21). Read-only GraphQL queries with your gh login.
reviews:
  enabled: true
  interval_minutes: 5

# Your comments on your own open tasks → the Assistant ("Process task replies" routine).
replies:
  enabled: true
  routine: Process task replies
  debounce_seconds: 90            # wait for follow-up comments / closing the task
  exclude_labels: [needs-review, engineer]   # handled by ops-mcp / this runner
  first_run_lookback_hours: 24

# Recurring tasks (D-25): the board keeps the schedules; the runner claims due runs every minute,
# adds the period's GitHub activity (read-only GraphQL with your gh login) and starts the Assistant.
recurring:
  enabled: true
  routine: Run recurring task
  board_url: http://127.0.0.1:3122      # the board's internal API (token: board_internal_token)
