# Pennyworth runner (host service): coding jobs for Paperclip tasks labelled "engineer".
# Copy to config/runner.yaml. Runs as you; see docs/DECISIONS.md D-14 for the guardrails.

label: engineer
poll_seconds: 20
# Comments written up to this long before the runner first sees a task still count.
first_seen_lookback_minutes: 30

# Orgs the runner may change: implement, push and pr. Public repositories anywhere else are
# read-only: investigate and answer only (D-35).
allowed_orgs: [your-org]

# Runner-owned clones (repos/) and per-task worktrees (tasks/). Never your own checkouts.
work_dir: ~/pennyworth
state_dir: ~/.local/state/pennyworth-runner

max_concurrent: 2
timeout_minutes: 60

engines:
  codex:
    model: ""                         # empty = your Codex default
  openrouter:                         # Engineer · OpenRouter; models it offers are listed in config/paperclip.yaml
    model: z-ai/glm-5.3-flash
    key_file: ~/.config/pennyworth/openrouter_key
  claude:                             # "engine: claude" / "use Claude": Claude Code, headless, inside codex sandbox
    model: ""                         # empty = Claude Code's default; or opus, sonnet, haiku, fable, claude-…
    auth: token                       # or login: native CLI login in the isolated config_dir
    token_file: ~/.config/pennyworth/claude_oauth_token   # from `claude setup-token` (0600)
    # Runner-owned Claude Code home: none of your plugins, hooks, MCP servers or claude.ai connectors.
    config_dir: ~/.local/state/pennyworth-runner/claude
    # A session past this much context starts afresh on the next turn, with the conversation and the
    # workspace: resuming it re-reads all of it on every call (D-60). 0 keeps sessions however long.
    fresh_session_tokens: 300000

# Primer for every engine, read-only (D-40). Token: $PENNYWORTH_SECRETS_DIR/primer_mcp_token.
# publish_url: where the runner itself publishes a task's Primer document (D-44); never given to jobs.
primer:
  enabled: true                     # false for personal instances: no reads, publishing, or prompt guidance
  url: http://127.0.0.1:3123/mcp/read
  publish_url: http://127.0.0.1:3123/mcp

# Grafana and Google Cloud, read-only, for Claude Code and Codex jobs only (D-48); never OpenRouter.
# Grafana: grafana-mcp on loopback (token: $PENNYWORTH_SECRETS_DIR/grafana_mcp_token).
# Google Cloud: scripts/gcloud-auth.sh signs in (again after the 16-hour session); each job gets a
# one-hour token with the user's access and the prompt's read-only rule, never the sign-in itself (D-53).
grafana:
  url: http://127.0.0.1:3124/mcp
# ClickHouse Cloud, SELECT queries only, for Claude Code and Codex jobs only (D-57); never OpenRouter.
# clickhouse-mcp on loopback (token: $PENNYWORTH_SECRETS_DIR/clickhouse_mcp_token).
clickhouse:
  url: http://127.0.0.1:3127/mcp
# Cloudflare, every account and zone with read scopes only, for Claude Code and Codex jobs only (D-64);
# never OpenRouter. cloudflare-mcp on loopback (token: $PENNYWORTH_SECRETS_DIR/cloudflare_mcp_token).
cloudflare:
  url: http://127.0.0.1:3128/mcp
# Jira and Confluence on every Atlassian account added in Settings, reads only, for Claude Code and Codex jobs only (D-69);
# never OpenRouter. jira-mcp's /mcp/read on loopback (token: $PENNYWORTH_SECRETS_DIR/jira_mcp_read_token).
jira:
  url: http://127.0.0.1:3129/mcp/read
gcp:
  credentials: ~/.config/pennyworth/gcloud/application_default_credentials.json
  # Projects jobs are told to start with; the first is gcloud's default.
  projects: []
  shell: pulumi                       # the devshell with gcloud, added to every Claude Code and Codex job
# AWS for Claude Code and Codex jobs only (D-59); never OpenRouter. scripts/aws-auth.sh signs Pennyworth
# in to IAM Identity Center (again when its session ends) and lists the accounts and roles it reaches.
# Each job gets one-hour credentials for every account's read_role (AWS refuses its writes); the
# write_role is used only by the runner, for a `pennyworth aws` command the user's words ask for.
# In the default SSO mode, leave sso_start_url empty to give jobs no AWS.
aws:
  auth: sso                         # default; optional iam for a dedicated read-only IAM user's keys
  sso_start_url: ""                   # e.g. https://d-0123456789.awsapps.com/start
  sso_region: ""                      # the Identity Center region, e.g. ca-central-1
  # home: ~/.config/pennyworth/aws    # Pennyworth's own AWS home (default), hidden from jobs
  accounts: []
  #  - name: prod-api                 # the job's profile name (--profile prod-api)
  #    id: "123456789012"
  #    region: ca-central-1           # default: sso_region
  #    read_role: ReadOnlyAccess      # an Identity Center permission set that can't change anything
  #    write_role: AdministratorAccess # optional: for `pennyworth aws` changes, on the user's word
  # IAM mode needs no SSO settings. Set an account's region and read_role: ReadOnlyAccess,
  # then run scripts/aws-auth.sh to enter its keys into Pennyworth's hidden AWS home.
  # read_role documents the IAM user's policy; it does not assume a role or restrict its permissions.
  # IAM mode does not support write_role. Jobs receive one-hour STS credentials, never the saved keys.

# Reads plain-language requests (target repo, reference repos, mode, model) with a short Codex call.
intake:
  model: ""                           # empty = your Codex default
  reasoning_effort: low
  timeout_seconds: 180

# Local build123d interpreter for CAD roles (scripts/cad/setup.sh installs it).
cad:
  python: scripts/cad/python

devshells:
  flake: ~/config/nixos               # nix develop <flake>#<shell>
  engine_shell: llm                   # provides codex/opencode; always outermost
  available: [go, go-cgo, kurtosis, llm, mobile, node, postgres, pulumi, python, python311, rust]
  # Detected from files in the repository root (override per task with "shells: go,pulumi").
  detect:
    go.mod: go
    package.json: node
    pnpm-lock.yaml: node
    Cargo.toml: rust
    pyproject.toml: python
    requirements.txt: python
    Pulumi.yaml: pulumi
  # Added when the instructions match (regex → shell): gcloud lives in the pulumi shell.
  keyword_shells:
    "gcloud|cloud logging|stackdriver|gke|bigquery|log explorer": pulumi

sandbox:
  # bwrap on Linux, permissions on macOS (no Bubblewrap there; bwrap is refused). permissions uses recent Codex profiles and avoids nested sandboxes for all engines.
  # credential_isolation: bwrap
  network: true                       # gh, gcloud, Grafana and package registries need it
  # Writable besides the task worktree (build caches); everything else is read-only to the agent.
  extra_writable_roots:
    - ~/.cache
    - ~/go/pkg/mod
    - ~/.npm
    - ~/.local/share/pnpm
    - ~/.cargo/registry
    - ~/.cargo/git
    - ~/.gradle

# Review-request tasks close themselves once GitHub shows you reviewed the PR (after the ask), or the
# PR was merged or closed (D-21). Read-only GraphQL queries with your gh login.
reviews:
  enabled: true
  interval_minutes: 5

# Merging the PRs an Engineer task lists, one at a time, in code (D-46).
merges:
  gap_minutes: 15        # between merges, unless the request says otherwise
  timeout_minutes: 90    # stop the queue when a check or CI stays pending this long

# Your comments on your own open tasks → the Assistant ("Process task replies" routine).
replies:
  enabled: true
  routine: Process task replies
  debounce_seconds: 90            # wait for follow-up comments / closing the task
  exclude_labels: [needs-review, engineer]   # handled by ops-mcp / this runner
  first_run_lookback_hours: 24

# Recurring tasks (D-25): the board keeps the schedules; the runner claims due runs every minute,
# adds the period's GitHub activity (read-only GraphQL with your gh login) and starts the Assistant.
recurring:
  enabled: true
  routine: Run recurring task
  board_url: http://127.0.0.1:3122      # the board's internal API (token: board_internal_token)
