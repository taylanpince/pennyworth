# Regression set for the runner's intake (services/runner/src/intake.mjs): comments and the reading
# each must get, run through the real intake call. Copy to config/intake-cases.yaml (gitignored)
# and fill it with real comments; add every misread found on a real task.
#
#   npm run eval:intake --prefix services/runner [-- <id filter>]
#
# Fields: id, why (optional), title, description (task text), own_description (true when you wrote
# the task: the description is part of the request), parent {identifier, title, description} (the
# user's task an Engineer's part belongs to, D-45), comment (your newest comment),
# context {known_repo, previous_mode, busy, has_work}, expect {action, mode, repo, references,
# engine, model, primer, gapMinutes}. An expected value can be a list of acceptable values, or null for "unset".

- id: target and reference repo
  title: New balance gateway
  comment: |-
    Write a spec first. Use the empty repo at https://github.com/0xPolygon/example-gateway and follow
    the approach of https://github.com/0xPolygon/example-reference. Use the astra model.
  expect: { action: run, mode: investigate, repo: 0xPolygon/example-gateway, references: [0xPolygon/example-reference] }

- id: prepare a PR on a fresh task
  why: "\"prepare a PR\" means do the work first, not publish"
  title: Point the dev gateway at the new service
  description: Follow the pattern of https://github.com/0xPolygon/example-infra/pull/12 and prepare one for the new service.
  own_description: true
  comment: ""
  expect: { action: run, mode: implement, repo: 0xPolygon/example-infra }

- id: question after changes
  title: New balance gateway
  comment: Can I use any value for the JWT_SECRET?
  context: { known_repo: 0xPolygon/example-gateway, previous_mode: implement, has_work: true }
  expect: { action: run, mode: answer }

- id: stop while busy
  title: New balance gateway
  comment: stop that, wrong direction
  context: { known_repo: 0xPolygon/example-gateway, previous_mode: implement, has_work: true, busy: true }
  expect: { action: stop }

- id: push it with work done
  title: New balance gateway
  comment: looks good, push it
  context: { known_repo: 0xPolygon/example-gateway, previous_mode: implement, has_work: true }
  expect: { action: push }

# Go-ahead on a parent task with Engineer sub-tasks waiting (D-24).
- id: "go-ahead: go"
  kind: go-ahead
  title: zkevm and cdk legacy repo deprecation notices
  comment: go
  context:
    waiting: &a1
      - "PEN-400: Deprecation notice: zkevm-prover"
      - "PEN-401: Deprecation notice: zkevm-rom"
      - "PEN-402: Deprecation notice: cdk-validium-node"
      - "PEN-403: Deprecation notice: zkevm-bench"
  expect:
    decision: start
- id: "go-ahead: skip one"
  kind: go-ahead
  why: A go-ahead with an exception must not start everything
  title: zkevm and cdk legacy repo deprecation notices
  comment: go, but skip zkevm-bench
  context:
    waiting: *a1
  expect:
    decision: other
- id: "go-ahead: wait"
  kind: go-ahead
  title: zkevm and cdk legacy repo deprecation notices
  comment: wait, I want to check with the team first
  context:
    waiting: *a1
  expect:
    decision: hold

- id: OpenRouter model by family name
  why: "\"deepseek\" is an OpenRouter model, mapped to the one listed for the OpenRouter Engineer"
  title: New balance gateway
  comment: Try this again with deepseek please, the last attempt went in circles.
  context: { known_repo: 0xPolygon/example-gateway, previous_mode: implement, has_work: true }
  expect: { action: run, mode: implement, engine: openrouter, model: deepseek/deepseek-v4.1-flash }

- id: OpenRouter without a model
  title: New balance gateway
  comment: Use OpenRouter for this one and write up how the balance cache works.
  context: { known_repo: 0xPolygon/example-gateway }
  expect: { action: run, mode: investigate, engine: openrouter, model: null }

- id: comment with attached files
  why: files uploaded from the board end the comment with an "Attached:" line (D-43); it isn't a repository or a command
  title: Gateway returns 502 under load
  comment: |-
    Here's the CI log and the error from the dashboard, can you figure out why it fails?

    Attached: `ci-run-4471.log`, `grafana-502.png`
  context: { known_repo: 0xPolygon/example-gateway }
  expect: { action: run, mode: [investigate, answer], references: [] }

- id: implement from an attached spec
  why: the request points at an attached file, not at a repository
  title: Rate limits per API key
  comment: |-
    Implement this per the attached spec.

    Attached: `rate-limits-v2.pdf`
  context: { known_repo: 0xPolygon/example-gateway }
  expect: { action: run, mode: implement, references: [] }

- id: publish a report to Primer
  why: "the report has to reach Primer, and that's a run (the agent writes the document), not push/pr"
  title: Investigate the gateway's failure signals
  comment: Publish to Primer so I can review there.
  context: { known_repo: 0xPolygon/example-gateway, previous_mode: investigate, last_result: "## Summary\nThe report is written." }
  expect: { action: run, mode: investigate, primer: true }

- id: Primer link to read is not publishing
  title: Gateway rate limits
  comment: Implement the design in https://primer.example.com/d/0000 in https://github.com/0xPolygon/example-gateway
  expect: { action: run, mode: implement, repo: 0xPolygon/example-gateway, primer: false }

# The Engineers by name (D-45): naming one picks its engine.
- id: "crew: Ada by name"
  title: New balance gateway
  comment: Let Ada take this one, the last attempt missed the edge cases.
  context: { known_repo: 0xPolygon/example-gateway, previous_mode: implement, has_work: true }
  expect: { action: run, mode: implement, engine: claude, model: null }

- id: "crew: Grace by name"
  title: New balance gateway
  comment: Ask Grace to write up how the balance cache is invalidated.
  context: { known_repo: 0xPolygon/example-gateway }
  expect: { action: run, mode: investigate, engine: codex }

- id: "crew: Linus with a model"
  title: New balance gateway
  comment: Have Linus try it with deepseek and fix the failing test.
  context: { known_repo: 0xPolygon/example-gateway, previous_mode: implement, has_work: true }
  expect: { action: run, mode: implement, engine: openrouter, model: deepseek/deepseek-v4.1-flash }

- id: "crew: a name in the task text is not a pick"
  why: "only the user's request picks the engine; a person called Ada in the task is not the Engineer"
  title: Reply to Ada Okafor about the gateway limits
  description: Ada Okafor asked whether the gateway limits are per key or per IP.
  comment: Find out from the code and answer here.
  context: { known_repo: 0xPolygon/example-gateway }
  expect: { action: run, mode: [answer, investigate], engine: null }

- id: merge approved PRs from the task
  why: merging existing PRs is the merge queue (D-46), not an agent run
  title: Merge the config PRs
  description: |-
    Work through the following approved PRs. Merge them one by one, giving at least 15 mins of time in between.
    Monitor CI status after every merge to make sure everything is clean on master. If you get stuck, notify me.

    Service A: https://github.com/0xPolygon/example-infra/pull/101
    Service B: https://github.com/0xPolygon/example-infra/pull/102
  own_description: true
  comment: ""
  expect: { action: merge, gapMinutes: 15 }

- id: carry on with the merges
  title: Merge the config PRs
  comment: Fixed the flaky check, carry on
  context: { known_repo: 0xPolygon/example-infra }
  expect: { action: merge }

- id: review before merging is a run
  title: Merge the config PRs
  comment: Can you check whether https://github.com/0xPolygon/example-infra/pull/103 is safe to merge?
  context: { known_repo: 0xPolygon/example-infra }
  expect: { action: run, mode: [answer, investigate] }

- id: same work in several repos
  why: the intake asked which of the named repositories to use, though all of them join the workspace (D-41)
  title: Prepare the release branches
  description: |-
    For the following repos:

    - 0xPolygon/example-gateway
    - 0xPolygon/example-infra

    Compare master with the release branch and rebase release on master.
  own_description: true
  comment: ""
  expect: { action: run, mode: implement, repo: 0xPolygon/example-gateway, references: [0xPolygon/example-infra] }

- id: crew part, repos on the parent
  why: an Engineer's part said only "go ahead … on dev-v2"; the repositories were on the user's task it belongs to
  title: Drop Telos Support
  description: Ada, go ahead and start this process on dev-v2 please
  own_description: true
  parent:
    identifier: PEN-1
    title: Drop Telos Support
    description: |-
      We've decided to drop support for Telos and Telos Testnet completely. This task will cover creating the necessary PRs across the following repos:

      - 0xPolygon/example-infra
      - 0xPolygon/example-gateway

      PRs should be created separately on a service by service basis on the devops repo, and provided in order of sunset (application layer first, then infra)
  comment: ""
  expect: { action: run, mode: implement, repo: 0xPolygon/example-infra, references: [0xPolygon/example-gateway] }

- id: fix, then merge
  why: "the merge half of \"fix it, then merge them\" was dropped: the agent can't merge, the runner must after the run"
  title: Remove an old network
  comment: Fix the conflict by rebasing, then start merging them one by one as I said.
  context: { known_repo: 0xPolygon/example-infra, previous_mode: investigate, has_work: true }
  expect: { action: run, mode: implement, mergeAfter: true }

- id: fix, I'll merge it myself
  title: Remove an old network
  comment: Fix the review comments. I'll merge it myself after.
  context: { known_repo: 0xPolygon/example-infra, has_work: true }
  expect: { action: run, mode: implement, mergeAfter: false }
