# Regression set for the go-ahead on Engineer sub-tasks (D-24, readApproval in
# services/runner/src/intake.mjs): comments on a parent task and the reading each must get, run through
# the real call. Copy to config/intake-cases.yaml (gitignored) and fill it with real comments.

#   npm run eval:intake --prefix services/runner [-- <id filter>]

# Fields: id, why (optional), kind: go-ahead, title, comment, context {waiting: ["PEN-1: title", …]},
# expect {decision: start | hold | other}. Requests to Engineers are no longer read by the runner:
# their GitHub writes have their own set, config/authorize-cases.example.yaml.


# Go-ahead on a parent task with Engineer sub-tasks waiting (D-24).
- id: "go-ahead: go"
  kind: go-ahead
  title: zkevm and cdk legacy repo deprecation notices
  comment: go
  context:
    waiting: &a1
      - "PEN-400: Deprecation notice: zkevm-prover"
      - "PEN-401: Deprecation notice: zkevm-rom"
      - "PEN-402: Deprecation notice: cdk-validium-node"
      - "PEN-403: Deprecation notice: zkevm-bench"
  expect:
    decision: start
- id: "go-ahead: skip one"
  kind: go-ahead
  why: A go-ahead with an exception must not start everything
  title: zkevm and cdk legacy repo deprecation notices
  comment: go, but skip zkevm-bench
  context:
    waiting: *a1
  expect:
    decision: other
- id: "go-ahead: wait"
  kind: go-ahead
  title: zkevm and cdk legacy repo deprecation notices
  comment: wait, I want to check with the team first
  context:
    waiting: *a1
  expect:
    decision: hold
