# Pennyworth stack. Start with: docker compose up -d
# Configuration comes from .env (see .env.example); secrets from $PENNYWORTH_SECRETS_DIR.
# The vault mounts for ops-mcp live in compose.vault.yaml, generated by scripts/bootstrap.sh.

name: pennyworth

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  paperclip:
    <<: *hardening
    # Pinned upstream release (2026.1001.0, commit 8f8a0ab7) by digest. Update deliberately.
    image: ghcr.io/paperclipai/paperclip:2026.1001.0@sha256:08dbadebd4d40550eb336c25c3691f582322a88bae3f1cca101c5dd096bdc9d3
    user: "${PUID:-1000}:${PGID:-100}"
    # Read the auth secret from a file instead of putting its value in this file.
    entrypoint:
      - /bin/sh
      - -c
      # Also exports the bearer tokens Codex sends to ops-mcp, google-workspace-mcp, slack-mcp, telegram-mcp, primer-mcp, glean-mcp and github-mcp
      # (bearer_token_env_var in the shared Codex config). $$ escapes compose interpolation.
      - >-
        export BETTER_AUTH_SECRET="$$(cat /run/secrets/paperclip_auth_secret)"
        PAPERCLIP_AGENT_JWT_SECRET="$$(cat /run/secrets/paperclip_agent_jwt_secret)"
        PENNYWORTH_OPS_MCP_TOKEN="$$(cat /run/secrets/ops_mcp_token)"
        PENNYWORTH_GOOGLE_MCP_TOKEN="$$(cat /run/secrets/google_mcp_token)"
        PENNYWORTH_SLACK_MCP_TOKEN="$$(cat /run/secrets/slack_mcp_token)"
        PENNYWORTH_TELEGRAM_MCP_TOKEN="$$(cat /run/secrets/telegram_mcp_token)"
        PENNYWORTH_PRIMER_MCP_TOKEN="$$(cat /run/secrets/primer_mcp_token)"
        PENNYWORTH_GLEAN_MCP_TOKEN="$$(cat /run/secrets/glean_mcp_token)"
        PENNYWORTH_GITHUB_MCP_TOKEN="$$(cat /run/secrets/github_mcp_token)"
        PENNYWORTH_BOARD_TOKEN="$$(cat /run/secrets/board_internal_token)"
        && exec /usr/bin/tini -- docker-entrypoint.sh "$$@"
      - paperclip
    command: ["node", "--import", "./server/node_modules/tsx/dist/loader.mjs", "server/dist/index.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: http://localhost:3100
      # "paperclip" lets ops-mcp and the watcher reach the API by service name.
      PAPERCLIP_ALLOWED_HOSTNAMES: paperclip,localhost
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "${PAPERCLIP_DISABLE_SIGN_UP:-false}"
      USER_UID: "${PUID:-1000}"
      USER_GID: "${PGID:-100}"
      # Agents use the ChatGPT login in /paperclip/.codex, never an API key from here.
      OPENAI_API_KEY: ""
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ${PENNYWORTH_DATA_DIR:-./data}/paperclip:/paperclip
      # Stdio MCP bridge for Paperclip task updates from sandboxed agents (read-only).
      - ./services/paperclip-tasks-mcp:/opt/pennyworth:ro
    secrets:
      - paperclip_auth_secret
      - paperclip_agent_jwt_secret
      # Bearer tokens Codex sends to ops-mcp / google-workspace-mcp (see config/paperclip.yaml).
      - ops_mcp_token
      - google_mcp_token
      - slack_mcp_token
      - telegram_mcp_token
      - primer_mcp_token
      - glean_mcp_token
      - github_mcp_token
      # The board's internal API, for the Assistant's task_schedule / task_recurring (D-25).
      - board_internal_token
    pids_limit: 2048
    # Fixed public resolvers: containers keep the host's DNS servers from when they started, and
    # a network or WARP change left every agent run failing at startup (2026-10-07).
    dns: [1.1.1.1, 8.8.8.8]
    networks:
      egress:
        gw_priority: 1   # published port and outbound traffic go through egress
      backplane: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  ops-mcp:
    <<: *hardening
    build: ./services/ops-mcp
    image: pennyworth/ops-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      OPS_MCP_CONFIG: /config/system.yaml
      OPS_MCP_TOKEN_FILE: /run/secrets/ops_mcp_token
    volumes:
      - ${PENNYWORTH_CONFIG_DIR:-./config}:/config:ro
      - ${PENNYWORTH_DATA_DIR:-./data}/ops-mcp:/data/ops-mcp
      # Writable: ops-mcp renames recorder-named transcripts and deletes their audio once published (D-26).
      - ${TRANSCRIPTS_DIR:?set TRANSCRIPTS_DIR in .env}:/sources/transcripts
      # Vault folders are added by compose.vault.yaml (only the configured folders).
    secrets:
      - ops_mcp_token
      - paperclip_ops_key
    # No egress: ops-mcp only talks to Paperclip on the internal network.
    networks:
      - backplane
    depends_on:
      paperclip:
        condition: service_started

  google-workspace-mcp:
    <<: *hardening
    build: ./services/google-workspace-mcp
    image: pennyworth/google-workspace-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GOOGLE_CREDENTIALS_FILE: /credentials/google_oauth.json
      MCP_TOKEN_FILE: /run/secrets/google_mcp_token
      # The board's sign-in endpoints (D-36): state per account, and reconnecting an expired one.
      GOOGLE_AUTH_TOKEN_FILE: /run/secrets/google_auth_token
      CALENDAR_ID: "${GOOGLE_CALENDAR_ID:-primary}"
      # Set GOOGLE_FIXTURES_DIR=/fixtures in .env to serve fixtures/ instead of Google (testing).
      GOOGLE_FIXTURES_DIR: "${GOOGLE_FIXTURES_DIR:-}"
    volumes:
      - ./fixtures:/fixtures:ro
      # Writable (not a secret) so a reconnect from the board can store the new refresh token (D-36).
      # A single-file mount: google-auth.sh writes the same file, and the service reloads on change.
      - ${PENNYWORTH_SECRETS_DIR}/google_oauth.json:/credentials/google_oauth.json
    secrets:
      - google_mcp_token
      - google_auth_token
    dns: [1.1.1.1, 8.8.8.8]   # see paperclip
    networks:
      - backplane
      - egress

  slack-mcp:
    <<: *hardening
    build: ./services/slack-mcp
    image: pennyworth/slack-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      SLACK_CLIENT_ID: "${SLACK_CLIENT_ID:-}"
      SLACK_TOKEN_FILE: /state/token.json
      MCP_TOKEN_FILE: /run/secrets/slack_mcp_token
    volumes:
      # Read-write: Slack rotates refresh tokens, so the newest pair must be persisted.
      - ${PENNYWORTH_SECRETS_DIR}/slack:/state
    secrets:
      - slack_mcp_token
    dns: [1.1.1.1, 8.8.8.8]   # see paperclip
    networks:
      - backplane
      - egress

  # Read-only Telegram through your own session (D-37): reads only, enforced by a request allowlist
  # in code (services/telegram-mcp/src/guard.ts). You sign in from the board.
  telegram-mcp:
    <<: *hardening
    build: ./services/telegram-mcp
    image: pennyworth/telegram-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      TELEGRAM_STATE_DIR: /state
      MCP_TOKEN_FILE: /run/secrets/telegram_mcp_token
      # The board's sign-in endpoints: sign-in state, and signing in with phone, code and 2FA password.
      TELEGRAM_AUTH_TOKEN_FILE: /run/secrets/telegram_auth_token
      # Plain-text names people call you ("dana, can you…"), comma-separated; @mentions and replies are Telegram's own flags.
      TELEGRAM_ME_ALIASES: "${TELEGRAM_ME_ALIASES:-}"
      # Chats never read (refs or exact titles, ";"-separated). Muted and archived chats are left out unless set to true.
      TELEGRAM_EXCLUDE: "${TELEGRAM_EXCLUDE:-}"
      TELEGRAM_INCLUDE_MUTED: "${TELEGRAM_INCLUDE_MUTED:-false}"
      TELEGRAM_INCLUDE_ARCHIVED: "${TELEGRAM_INCLUDE_ARCHIVED:-false}"
      # How the session shows under Telegram → Settings → Devices.
      TELEGRAM_DEVICE_NAME: "${TELEGRAM_DEVICE_NAME:-Pennyworth}"
    volumes:
      # Read-write: api.json (your app at my.telegram.org), the session (written when you sign in
      # from the board), and the scout's cursors (IDs only, no message text). All 0600.
      - ${PENNYWORTH_SECRETS_DIR}/telegram:/state
    secrets:
      - telegram_mcp_token
      - telegram_auth_token
    dns: [1.1.1.1, 8.8.8.8]   # see paperclip
    networks:
      - backplane
      - egress

  # Primer, the organization's document host: read, and publish documents and versions (D-31).
  primer-mcp:
    <<: *hardening
    build: ./services/primer-mcp
    image: pennyworth/primer-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      PRIMER_MCP_URL: "${PRIMER_MCP_URL:-}"
      PRIMER_TOKEN_FILE: /state/token.json
      MCP_TOKEN_FILE: /run/secrets/primer_mcp_token
    volumes:
      # Read-write: Primer rotates the refresh token on every refresh.
      - ${PENNYWORTH_SECRETS_DIR}/primer:/state
    secrets:
      - primer_mcp_token
    dns: [1.1.1.1, 8.8.8.8]   # see paperclip
    ports:
      # Loopback only, for the runner's Engineer jobs on the host: /mcp/read, bearer token (D-40).
      - "127.0.0.1:3123:8084"
    networks:
      - backplane
      - egress

  # Glean, the organization's company-wide search: reads only (D-38). Signed in from the board.
  glean-mcp:
    <<: *hardening
    build: ./services/glean-mcp
    image: pennyworth/glean-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GLEAN_MCP_URL: "${GLEAN_MCP_URL:-}"
      GLEAN_STATE_DIR: /state
      MCP_TOKEN_FILE: /run/secrets/glean_mcp_token
      # The board's sign-in endpoints: state, and starting or finishing a sign-in.
      GLEAN_AUTH_TOKEN_FILE: /run/secrets/glean_auth_token
    volumes:
      # Read-write: the registered client and the token pair, refreshed here.
      - ${PENNYWORTH_SECRETS_DIR}/glean:/state
    secrets:
      - glean_mcp_token
      - glean_auth_token
    dns: [1.1.1.1, 8.8.8.8]   # see paperclip
    networks:
      - backplane
      - egress

  # GitHub issues and pull requests: read, and comment on them in GITHUB_COMMENT_ORGS (D-39). Holds
  # the user's gh token; services/github-mcp/src/github.ts allows only those requests.
  github-mcp:
    <<: *hardening
    build: ./services/github-mcp
    image: pennyworth/github-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      GITHUB_COMMENT_ORGS: "${GITHUB_COMMENT_ORGS:-}"
      MCP_TOKEN_FILE: /run/secrets/github_mcp_token
    secrets:
      - github_token
      - github_mcp_token
    dns: [1.1.1.1, 8.8.8.8]   # see paperclip
    networks:
      - backplane
      - egress

  # The task board (D-22): Today/Tomorrow/Later over your Paperclip tasks. Acts as you through the
  # board key, kept server-side; loopback only (put `tailscale serve` in front for the phone).
  board:
    <<: *hardening
    build: ./services/board
    image: pennyworth/board:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      BOARD_SYSTEM_CONFIG: /config/system.yaml
      BOARD_KEY_FILE: /run/secrets/paperclip_board_key
      BOARD_DB: /data/board/board.sqlite
      PAPERCLIP_URL: http://paperclip:3100
      # Host names the board answers to (DNS-rebinding guard); add your tailnet name for the phone.
      BOARD_ALLOWED_HOSTS: "${BOARD_ALLOWED_HOSTS:-localhost:3120,127.0.0.1:3120}"
      # Phones on the home network (D-23): off unless BOARD_LAN_CLIENTS (client CIDRs) is set.
      # Paired devices only, at BOARD_LAN_HOSTS (pennyworth.local is published by mDNS).
      BOARD_LAN_CLIENTS: "${BOARD_LAN_CLIENTS:-}"
      BOARD_LAN_HOSTS: "${BOARD_LAN_HOSTS:-pennyworth.local}"
      # Where pairing links send the phone (default http://<first LAN host>), e.g. the tailnet name.
      BOARD_LAN_URL: "${BOARD_LAN_URL:-}"
    volumes:
      - ${PENNYWORTH_CONFIG_DIR:-./config}/system.yaml:/config/system.yaml:ro
      - ${PENNYWORTH_DATA_DIR:-./data}/board:/data/board
    secrets:
      - paperclip_board_key
      - board_internal_token
      - google_auth_token   # Google sign-in state and reconnect only (D-36); not the MCP token
      - telegram_auth_token # Telegram sign-in state and sign-in only (D-37); not the MCP token
      - glean_auth_token    # Glean sign-in state and sign-in only (D-38); not the MCP token
    ports:
      - "127.0.0.1:3120:3120"
      # LAN listener; loopback-only unless .env sets BOARD_LAN_BIND=0.0.0.0 (e.g. with BOARD_LAN_PORT=80).
      - "${BOARD_LAN_BIND:-127.0.0.1}:${BOARD_LAN_PORT:-3121}:3121"
      # Internal API (D-25): bearer token, /internal/ only. The runner on the host claims recurring
      # runs here; the tasks bridge in paperclip reaches it as board:3122 on the backplane.
      - "127.0.0.1:3122:3122"
    # backplane reaches Paperclip; egress only carries the published port (the board makes no outbound calls).
    networks:
      - backplane
      - egress
    depends_on:
      paperclip:
        condition: service_started

networks:
  # Explicit 10.x subnets: some host firewalls (here: NordVPN's) drop traffic to Docker's
  # default 172.16.0.0/12 pools, which breaks the published 127.0.0.1:3100 port.
  # Service-to-service traffic only, no route to the Internet. ops-mcp lives only here.
  backplane:
    internal: true
    ipam:
      config:
        - subnet: ${PENNYWORTH_BACKPLANE_SUBNET:-10.231.0.0/24}
  # Outbound access (Paperclip → OpenAI, Google sidecar → Google APIs) and the published port.
  egress:
    ipam:
      config:
        - subnet: ${PENNYWORTH_EGRESS_SUBNET:-10.231.1.0/24}

secrets:
  paperclip_auth_secret:
    file: ${PENNYWORTH_SECRETS_DIR:?set PENNYWORTH_SECRETS_DIR in .env}/paperclip_auth_secret
  paperclip_agent_jwt_secret:
    file: ${PENNYWORTH_SECRETS_DIR}/paperclip_agent_jwt_secret
  ops_mcp_token:
    file: ${PENNYWORTH_SECRETS_DIR}/ops_mcp_token
  paperclip_ops_key:
    file: ${PENNYWORTH_SECRETS_DIR}/paperclip_ops_key
  google_auth_token:
    file: ${PENNYWORTH_SECRETS_DIR}/google_auth_token
  google_mcp_token:
    file: ${PENNYWORTH_SECRETS_DIR}/google_mcp_token
  slack_mcp_token:
    file: ${PENNYWORTH_SECRETS_DIR}/slack_mcp_token
  telegram_mcp_token:
    file: ${PENNYWORTH_SECRETS_DIR}/telegram_mcp_token
  telegram_auth_token:
    file: ${PENNYWORTH_SECRETS_DIR}/telegram_auth_token
  primer_mcp_token:
    file: ${PENNYWORTH_SECRETS_DIR}/primer_mcp_token
  glean_mcp_token:
    file: ${PENNYWORTH_SECRETS_DIR}/glean_mcp_token
  glean_auth_token:
    file: ${PENNYWORTH_SECRETS_DIR}/glean_auth_token
  github_mcp_token:
    file: ${PENNYWORTH_SECRETS_DIR}/github_mcp_token
  # The user's gh token (scripts/github-auth.sh), for github-mcp only.
  github_token:
    file: ${PENNYWORTH_SECRETS_DIR}/github_token
  paperclip_board_key:
    file: ${PENNYWORTH_SECRETS_DIR}/paperclip_board_key
  board_internal_token:
    file: ${PENNYWORTH_SECRETS_DIR}/board_internal_token
